<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../estilos/PaginaWebRegistrarse.css">
</head>
<header>
    <a href="PaginaWeb.html"><img src="../img/regresar.png" style="height:50px; width: 50px;" id="img1"></a>
    <img src="../img/Logo.png" style="height:150px; width:120px;" id="img">
</header>
<body>
    <div class="container">
    <form method="POST" action="../scripts/usuario_registrar.php" id="formRegistro">
        <h2>Registrarse</h2>
        <hr>
        
        <label for="email">Name</label>
        <div class="form-floating mb-3">
            <input type="text" class="form-control" id="nombre" name="nombre" placeholder="name@example.com">
            <label for="floatingInput">Name</label>
          </div>
          <label for="email">Email</label>
        <div class="form-floating mb-3">
            <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com">
            <label for="floatingInput">Email address</label>
          </div>
          <label for="password">Password</label>
          <div class="form-floating">
            <input type="password" class="form-control" id="contraseña" name="contraseña" placeholder="Password">
            <label for="floatingPassword">Password</label>
          </div>
          <br>
          <br>
          <div>
            
          <div class="form-check text-start" style="text-align: left; margin: 15px 0;">
            <input class="form-check-input" type="checkbox" value="1" id="politica_privacidad" name="politica_privacidad" required>
            <label class="form-check-label" for="politica_privacidad" style="font-size: 13px; color: #333;">
              He leído y acepto el <strong>Aviso de Privacidad</strong> y consiento el tratamiento de mis datos personales de conformidad con los lineamientos de GoTaxi.
            </label>
          </div>
          <input type="submit" value="Crear nueva cuenta" class="btn btn-primary BtnRegistrar" name="btnregistrar">
        </div>
        </form>
    </div>
</div>
</body>

</html>
