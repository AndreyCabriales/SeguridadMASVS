<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesion</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../estilos/PaginaWebIniciarSesion.css">
</head>
<header>
    <a src="../img/Logo.png" href="PaginaWeb.html" style="height:150px; width:120px;" id="img"></a>
</header>
<body>
        <form  method="POST" action="../scripts/usuario_login.php" id="formLogin">
        <h2 for="Titulo">Iniciar Sesion</h2>
        <div id="alertaAuth" class="alert alert-warning py-2" style="display:none; font-size:0.9rem;"><strong>Acceso restringido (MASVS-AUTH):</strong> Inicia sesion para acceder a los paneles administrativos.</div>
        <hr>
        <label for="email">Email</label>
        <div class="form-floating mb-3">
            <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required>
            <label for="floatingInput">Email address</label>
          </div>
          <label for="password">Password</label>
          <div class="form-floating">
            <input type="password" class="form-control" id="contraseña" name="contraseña" placeholder="Password" required>
            <label for="floatingPassword">Password</label>
            <br>
            <br>
            <input type="submit" value="Iniciar Sesion" class="BtnRegistrar btn btn-primary" name="btnregistrar">

        </form>
        <div >
          <a class="btn btn-primary" href="PaginaWebRegistrarse.html" role="button" id="irregistrarse">Registrarse</a>
        </div>
</body>
<script src="../js/PaginaWebRegistrarse.js"></script>
<script>if(window.location.search.indexOf('auth=required')!==-1){var a=document.getElementById('alertaAuth');if(a)a.style.display='block';}</script>
</html>
